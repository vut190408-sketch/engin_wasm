name: Build Rust WASM and Deploy to Pages

on:
  push:
    branches: [ "main" ]

# Cấp quyền cần thiết cho tính năng Deploy Pages chính chủ của GitHub
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có 1 tiến trình deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Thay thế actions-rs bằng dtolnay/rust-toolchain (chuẩn và được duy trì)
      - name: Cài đặt Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cài đặt wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Biên dịch Rust sang WASM
        run: wasm-pack build --target web

      - name: Chuẩn bị thư mục Deploy
        run: |
          mkdir deploy_folder
          cp index.html deploy_folder/
          cp -r pkg deploy_folder/

      # Dùng bộ Action chính chủ do chính GitHub phát triển (100% không bị chặn chính sách)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_folder'

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
