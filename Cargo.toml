[package]
name = "wasm_docx_parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# quick-xml để đọc file document.xml cực nhanh
quick-xml = "0.31"
# zip để bung nén file docx trên RAM (chỉ dùng deflate thuần Rust để tương thích WASM)
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# base64 để chuyển ảnh thành chuỗi chuẩn bị render
base64 = "0.21"