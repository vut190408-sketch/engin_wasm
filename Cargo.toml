[package]
name = "docx_extractor_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.31"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
base64 = "0.21"
indexmap = { version = "2.0", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "js"] }
